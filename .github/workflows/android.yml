name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스 태그 (예: v1.0.0). 서명된 ARM64 APK를 GitHub Release에 게시'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64
      - run: ./gradlew app:testDebugUnitTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build signed ARM64 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --target-platform android-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cp build/app/outputs/flutter-apk/app-release.apk goyo-android-arm64.apk
          sha256sum goyo-android-arm64.apk > SHA256SUMS
          gh release create "$RELEASE_TAG" goyo-android-arm64.apk SHA256SUMS \
            --target "$GITHUB_SHA" --title "고요 $RELEASE_TAG" --generate-notes
      - name: Remove temporary key
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"
